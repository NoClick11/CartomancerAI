[project]
name = "cartomancer"
version = "0.1.0"
description = "Fila local para gerar mapas de RPG com IA (ComfyUI + Flux.1 dev GGUF)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "websocket-client>=1.8",
]

[project.scripts]
cartomancer = "cartomancer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartomancer"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer.Argument()/typer.Option() calls in defaults are the standard Typer idiom.
"src/cartomancer/cli/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
